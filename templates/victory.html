{% extends "layout.html" %}

{% block title %}
¡Has Escapado!
{% endblock %}

{% block content %}
<div class="narrative-container">
    <h2 class="text-center">¡Victoria!</h2>
    <p class="lead text-center">Has completado con éxito la sala: <strong>{{ room_title }}</strong>.</p>
    
    <div class="text-center mt-4">
        <p>Tu tiempo final fue:</p>
        <h3>{{ time_taken }}</h3>
    </div>

    <div class="text-center mt-5">
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">Jugar de Nuevo</a>
    </div>
</div>
{% endblock %}
