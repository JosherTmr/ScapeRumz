{% extends "layout.html" %}

{% block title %}Luz Roja, Luz Verde{% endblock %}

{% block content %}
<style>
    :root {
        --squid-red: #e84393; /* Un rosa más intenso, casi fucsia */
        --squid-green-mint: #00b894;
        --squid-dark-bg: #1e272e;
        --squid-panel-bg: #2d3436;
        --squid-floor: #485460;
        --squid-text: #d2dae2;
    }

    body {
        background-color: var(--squid-dark-bg);
        color: var(--squid-text);
        font-family: 'Source Code Pro', 'Courier New', Courier, monospace;
    }
    .game-container {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        justify-content: center;
        margin-top: 2rem;
    }
    .shake-animation {
        animation: shake 0.5s ease-in-out;
    }
    @keyframes shake {
        0% { transform: translateX(0); }
        10% { transform: translateX(-10px); }
        20% { transform: translateX(10px); }
        30% { transform: translateX(-10px); }
        40% { transform: translateX(10px); }
        50% { transform: translateX(0); }
    }
    #game-board {
        display: grid;
        border: 2px solid var(--squid-red);
        background-color: var(--squid-panel-bg);
        padding: 5px;
    }
    .tile {
        width: 25px;
        height: 25px;
        box-sizing: border-box;
    }
    .tile-1 { background-color: var(--squid-red); box-shadow: 0 0 8px var(--squid-red); }
    .tile-0, .tile-4 { background-color: var(--squid-floor); }
    .tile-2 { background-color: var(--squid-red); filter: brightness(1.5); }
    .tile-3 { background-color: var(--squid-red); opacity: 0.6; }
    .tile-5 {
        background-color: #fff;
        border-radius: 50%;
        animation: pulse-doll 2s infinite;
    }
     @keyframes pulse-doll {
        0% { box-shadow: 0 0 5px #fff; }
        50% { box-shadow: 0 0 20px #fff, 0 0 30px var(--squid-red); }
        100% { box-shadow: 0 0 5px #fff; }
    }
    
    .player {
        background-color: var(--squid-green-mint);
        border-radius: 50%;
        width: 20px;
        height: 20px;
        margin: 2.5px;
        transition: all 0.2s ease-in-out;
        box-shadow: 0 0 8px var(--squid-green-mint);
    }

    .game-info {
        width: 250px;
        padding: 20px;
        background-color: var(--squid-panel-bg);
        border: 2px solid var(--squid-red);
        border-radius: 0.25rem;
        text-align: center;
    }
    #timer {
        font-size: 2.5em;
        font-weight: bold;
        margin-bottom: 20px;
        color: var(--squid-red);
    }
    #light-status {
        padding: 20px;
        font-size: 1.5em;
        text-transform: uppercase;
        font-weight: bold;
        transition: background-color 0.5s, box-shadow 0.5s;
        border-radius: 0.25rem;
        color: #fff;
    }
    .light-green { background-color: var(--squid-green-mint); box-shadow: 0 0 15px var(--squid-green-mint); }
    .light-red { background-color: var(--squid-red); box-shadow: 0 0 15px var(--squid-red); }

    #question-modal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.85);
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .modal-content {
        background-color: var(--squid-panel-bg);
        color: var(--squid-text);
        padding: 40px;
        border: 5px solid var(--squid-red);
        border-radius: 1rem;
        text-align: center;
        width: 80%;
        max-width: 600px;
        box-shadow: 0 0 30px var(--squid-red);
        position: relative;
    }
    #question-timer {
        position: absolute;
        top: 15px;
        right: 25px;
        font-size: 2em;
        font-weight: bold;
    }
    #question-text { font-size: 1.5em; margin-bottom: 20px; color: var(--squid-red); }
    #answer-input {
        display: block;
        width: 100%;
        padding: 0.75rem;
        font-size: 1rem;
        margin-bottom: 20px;
        border: 1px solid var(--squid-red);
        border-radius: 0.25rem;
        background-color: var(--squid-dark-bg);
        color: var(--squid-text);
    }
    #submit-answer {
        padding: 10px 20px;
        background-color: var(--squid-red);
        border: none;
        color: white;
        cursor: pointer;
        border-radius: 0.25rem;
        font-size: 1rem;
        text-transform: uppercase;
    }
    #game-message {
        margin-top: 20px;
        font-weight: bold;
        color: var(--squid-green-mint);
        min-height: 24px;
    }
</style>

<div class="game-container">
    <div id="game-board"></div>
    <div class="game-info">
        <h2>Juego 5: Luz Roja, Luz Verde</h2>
        <div id="timer">--:--</div>
        <div id="light-status">Cargando...</div>
        <div id="game-message">Usa las flechas para moverte.</div>
    </div>
</div>

<div id="question-modal">
    <div class="modal-content">
        <div id="question-timer">10</div>
        <h2 id="question-text">Pregunta</h2>
        <input type="text" id="answer-input" placeholder="Escribe tu respuesta aquí...">
        <button id="submit-answer">Enviar</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/game_utils.js') }}"></script>
<script>
    const room_name = '{{ room_name }}';
    const stage_name = '{{ stage_name }}';
    const win_token = '{{ win_token }}';
</script>
<script src="{{ url_for('static', filename='js/games/squid/luzroja.js') }}"></script>
{% endblock %}
