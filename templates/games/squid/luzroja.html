{% extends "layout.html" %}

{% block title %}Luz Roja, Luz Verde{% endblock %}

{% block content %}
<style>
    :root {
        --squid-red: #e84393; /* Un rosa más intenso, casi fucsia */
        --squid-green-mint: #00b894;
        --squid-dark-bg: #1e272e;
        --squid-panel-bg: #2d3436;
        --squid-floor: #485460;
        --squid-text: #d2dae2;
    }

    body {
        background-color: var(--squid-dark-bg);
        color: var(--squid-text);
        font-family: 'Source Code Pro', 'Courier New', Courier, monospace;
    }
    .game-container {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        justify-content: center;
        margin-top: 2rem;
    }
    .shake-animation {
        animation: shake 0.5s ease-in-out;
    }
    @keyframes shake {
        0% { transform: translateX(0); }
        10% { transform: translateX(-10px); }
        20% { transform: translateX(10px); }
        30% { transform: translateX(-10px); }
        40% { transform: translateX(10px); }
        50% { transform: translateX(0); }
    }
    #game-board {
        display: grid;
        border: 2px solid var(--squid-red);
        background-color: var(--squid-panel-bg);
        padding: 5px;
    }
    .tile {
        width: 25px;
        height: 25px;
        box-sizing: border-box;
    }
    .tile-1 { background-color: var(--squid-red); box-shadow: 0 0 8px var(--squid-red); }
    .tile-0, .tile-4 { background-color: var(--squid-floor); }
    .tile-2 { background-color: var(--squid-red); filter: brightness(1.5); }
    .tile-3 { background-color: var(--squid-red); opacity: 0.6; }
    .tile-5 {
        background-color: #fff;
        border-radius: 50%;
        animation: pulse-doll 2s infinite;
    }
     @keyframes pulse-doll {
        0% { box-shadow: 0 0 5px #fff; }
        50% { box-shadow: 0 0 20px #fff, 0 0 30px var(--squid-red); }
        100% { box-shadow: 0 0 5px #fff; }
    }
    
    .player {
        background-color: var(--squid-green-mint);
        border-radius: 50%;
        width: 20px;
        height: 20px;
        margin: 2.5px;
        transition: all 0.2s ease-in-out;
        box-shadow: 0 0 8px var(--squid-green-mint);
    }

    .game-info {
        width: 250px;
        padding: 20px;
        background-color: var(--squid-panel-bg);
        border: 2px solid var(--squid-red);
        border-radius: 0.25rem;
        text-align: center;
    }
    #timer {
        font-size: 2.5em;
        font-weight: bold;
        margin-bottom: 20px;
        color: var(--squid-red);
    }
    #light-status {
        padding: 20px;
        font-size: 1.5em;
        text-transform: uppercase;
        font-weight: bold;
        transition: background-color 0.5s, box-shadow 0.5s;
        border-radius: 0.25rem;
        color: #fff;
    }
    .light-green { background-color: var(--squid-green-mint); box-shadow: 0 0 15px var(--squid-green-mint); }
    .light-red { background-color: var(--squid-red); box-shadow: 0 0 15px var(--squid-red); }

    #question-modal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.85);
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .modal-content {
        background-color: var(--squid-panel-bg);
        color: var(--squid-text);
        padding: 40px;
        border: 5px solid var(--squid-red);
        border-radius: 1rem;
        text-align: center;
        width: 80%;
        max-width: 600px;
        box-shadow: 0 0 30px var(--squid-red);
        position: relative;
    }
    #question-timer {
        position: absolute;
        top: 15px;
        right: 25px;
        font-size: 2em;
        font-weight: bold;
    }
    #question-text { font-size: 1.5em; margin-bottom: 20px; color: var(--squid-red); }
    #answer-input {
        display: block;
        width: 100%;
        padding: 0.75rem;
        font-size: 1rem;
        margin-bottom: 20px;
        border: 1px solid var(--squid-red);
        border-radius: 0.25rem;
        background-color: var(--squid-dark-bg);
        color: var(--squid-text);
    }
    #submit-answer {
        padding: 10px 20px;
        background-color: var(--squid-red);
        border: none;
        color: white;
        cursor: pointer;
        border-radius: 0.25rem;
        font-size: 1rem;
        text-transform: uppercase;
    }
    #game-message {
        margin-top: 20px;
        font-weight: bold;
        color: var(--squid-green-mint);
        min-height: 24px;
    }
</style>

<div class="game-container">
    <div id="game-board"></div>
    <div class="game-info">
        <h2>Luz Roja, Luz Verde</h2>
        <div id="timer">--:--</div>
        <div id="light-status">Cargando...</div>
        <div id="game-message">Usa las flechas para moverte.</div>
    </div>
</div>

<div id="question-modal">
    <div class="modal-content">
        <div id="question-timer">10</div>
        <h2 id="question-text">Pregunta</h2>
        <input type="text" id="answer-input" placeholder="Escribe tu respuesta aquí...">
        <button id="submit-answer">Enviar</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/game_utils.js') }}"></script>
<script>
    function initLuzRojaGame(roomName, stageName, winToken) {
        const gameContainer = document.querySelector('.game-container');
        const boardElement = document.getElementById('game-board');
        const timerElement = document.getElementById('timer');
        const lightStatusElement = document.getElementById('light-status');
        const messageElement = document.getElementById('game-message');
        const questionModal = document.getElementById('question-modal');
        const questionText = document.getElementById('question-text');
        const questionTimer = document.getElementById('question-timer');
        const answerInput = document.getElementById('answer-input');
        const submitAnswerBtn = document.getElementById('submit-answer');

        let gameState = {};
        let gameInterval;

        function renderBoard(map, playerPos) {
            boardElement.innerHTML = '';
            const rows = map.length;
            const cols = map[0].length;
            boardElement.style.gridTemplateColumns = `repeat(${cols}, 25px)`;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const tile = document.createElement('div');
                    tile.className = `tile tile-${map[y][x]}`;
                    if (playerPos.x === x && playerPos.y === y) {
                        const playerDiv = document.createElement('div');
                        playerDiv.className = 'player';
                        tile.appendChild(playerDiv);
                    }
                    boardElement.appendChild(tile);
                }
            }
        }

        function updateUI(state) {
            const minutes = Math.floor(state.time_left / 60);
            const seconds = state.time_left % 60;
            timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            lightStatusElement.className = `light-status ${state.light_state === 'green' ? 'light-green' : 'light-red'}`;
            lightStatusElement.textContent = state.light_state === 'green' ? 'LUZ VERDE' : 'LUZ ROJA';

            if (state.question_pending && state.question_time_left !== null) {
                questionTimer.textContent = state.question_time_left;
                questionTimer.style.color = state.question_time_left <= 3 ? 'var(--squid-red)' : 'var(--squid-text)';
            }

            if (gameState.map) {
                renderBoard(gameState.map, state.player_pos);
            }
        }

        function handleEffects(effects) {
            if (effects.includes('shake')) {
                gameContainer.classList.add('shake-animation');
                setTimeout(() => gameContainer.classList.remove('shake-animation'), 500);
            }
        }

        async function handleKeydown(e) {
            // Bloquear movimiento si hay una pregunta o el juego ya ha sido ganado.
            if (questionModal.style.display === 'flex' || gameState.win) return;

            let dx = 0, dy = 0;
            switch(e.key) {
                case 'ArrowUp': dy = -1; break;
                case 'ArrowDown': dy = 1; break;
                case 'ArrowLeft': dx = -1; break;
                case 'ArrowRight': dx = 1; break;
                default: return;
            }

            // Una única llamada a la API que el backend se encarga de gestionar.
            const response = await fetch('/api/squid/luzroja/move', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ dx, dy })
            });
            const data = await response.json();

            if (data.status === 'ask_question') {
                questionText.textContent = data.question;
                questionModal.style.display = 'flex';
                answerInput.focus();
            } else if (data.status === 'success') {
                gameState.player_pos = data.new_pos;
                renderBoard(gameState.map, gameState.player_pos);
            }
        }

        async function submitAnswer() {
            const answer = answerInput.value;
            const response = await fetch('/api/squid/luzroja/answer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ answer })
            });
            const data = await response.json();
            messageElement.textContent = data.message;
            gameState.player_pos = data.player_pos;
            renderBoard(gameState.map, gameState.player_pos);
            questionModal.style.display = 'none';
            answerInput.value = '';
        }

        async function pollState() {
            if (gameState.win) return;
            const response = await fetch('/api/squid/luzroja/state');
            if (!response.ok) return;
            const state = await response.json();
            gameState = Object.assign(gameState, state);

            // Si el backend ha eliminado la pregunta (por timeout), pero el modal sigue abierto, ciérralo.
            if (!state.question_pending && questionModal.style.display === 'flex') {
                questionModal.style.display = 'none';
                answerInput.value = '';
            }

            if (state.effects && state.effects.length > 0) handleEffects(state.effects);
            if (state.message) messageElement.textContent = state.message;

            if (state.win) {
                clearInterval(gameInterval);
                submitWin(roomName, stageName, winToken);
                return;
            }
            if (state.game_over) {
                clearInterval(gameInterval);
                failGame(state.message || "¡Juego terminado!", roomName);
                return;
            }

            updateUI(state);
        }

        async function startGame() {
            messageElement.textContent = "Iniciando nueva partida...";
            const response = await fetch('/api/squid/luzroja/start', { method: 'POST' });
            const data = await response.json();

            gameState = data;
            renderBoard(data.map, data.player_pos);

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(pollState, 500);

            document.addEventListener('keydown', handleKeydown);
            submitAnswerBtn.addEventListener('click', submitAnswer);
            answerInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') submitAnswer();
            });
            messageElement.textContent = "Usa las flechas para moverte.";
        }

        startGame();
    }

    document.addEventListener('DOMContentLoaded', () => {
        initLuzRojaGame('{{ room_name }}', '{{ stage_name }}', '{{ win_token }}');
    });
</script>
{% endblock %}
